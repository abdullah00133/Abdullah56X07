<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Dog Profile</title>
    <link href=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4" style="background: rgb(89, 0, 255);">
    <div class="container" style="max-width: 400px;">
        <h1>Dog Profile</h1>

        <div class="card p-3 mb-3">
            <h5 style="color:#ff4346;">Dog Details</h5>
            <p><strong>Name:</strong> <span id="name"></span></p>
            <p><strong>Age:</strong> <span id="age"></span></p>
            <p><strong>Breed:</strong> <span id="breed"></span></p>
        </div>



    <script>
        var myDog = { name: "Buddy", age: "3 years", breed: "Pitt Bull" };

        document.getElementById("name").textContent = myDog.name;
        document.getElementById("age").textContent = myDog.age;
        document.getElementById("breed").textContent = myDog.breed;

        document.getElementById("codeDisplay").textContent = JSON.stringify(myDog, null, 2);
    </script>
</body>

</html>
