<!DOCTYPE html>
<html>

<head>
    <title>Elite Guardians Command</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
        }

        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .hero-card {
            background-color: #1e293b;
            border: 3px solid #38bdf8;
            border-radius: 12px;
            width: 220px;
            padding: 18px;
        }

        .hero-name {
            font-size: 22px;
            font-weight: bold;
            color: #f8fafc;
        }

        .hero-power {
            color: #f43f5e;
            font-weight: bold;
        }

        .hero-mission {
            color: #cbd5e1;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>Elite Guardians Command</h1>

    <p>
        Initialize the command system to deploy active defense operatives.    </p>

    <button onclick="showHeroes()">Deploy Guardians</button>

    <div class="card-container" id="heroCards"></div>

    <script>
        class Superhero {

            constructor(name, power, mission) {
                this.name = name;
                this.power = power;
                this.mission = mission;
            }

            describeHero() {
                return "<div class='hero-card'>" +
                    "<p class='hero-name'>" + this.name + "</p>" +
                    "<p class='hero-power'>Ability: " + this.power + "</p>" +
                    "<p class='hero-mission'>Objective: " + this.mission + "</p>" +
                    "</div>";
            }
        }

        function showHeroes() {

            let hero1 = new Superhero(
                "Captain Code",
                "Debugging errors",
                "Fix broken programs and save the coding world."
            );

            let hero2 = new Superhero(
                "Pixel Flash",
                "Super speed design",
                "Build colourful websites in seconds."
            );

            let hero3 = new Superhero(
                "Logic Girl",
                "Smart problem-solving",
                "Use logic to solve tricky challenges."
            );

            let hero4 = new Superhero(
                "Data Knight",
                "Data protection",
                "Keep important information safe."
            );

            document.getElementById("heroCards").innerHTML =
                hero1.describeHero() +
                hero2.describeHero() +
                hero3.describeHero() +
                hero4.describeHero();
        }
    </script>

</body>

</html>
