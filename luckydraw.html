<!DOCTYPE html>
<html>

<head>
    <title>Lucky Draw</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: aliceblue;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: navy;
        }

        input {
            padding: 8px;
            margin: 5px;
            border: 2px solid navy;
            border-radius: 6px;
            width: 220px;
        }
    </style>
</head>

<body>

    <h1>lucky draw</h1>
    <p>Enter your name and guess a number to win</p>

    <input type="text" id="name" placeholder="your name" required><br><br>
    <input type="number" id="guess" placeholder="your guess" required><br>

    <p id="msg-name"></p>
    <p id="msg-guess"></p>

    <button onclick="checkForm()">Try My Luck!</button>
    <p id="result"></p>
    <p id="timer"></p>

    <script>
        var seconds = 0;
        setInterval(function () {
            seconds = seconds + 1;
            document.getElementById("timer").textContent = "you have been here for " + seconds + " seconds!";
        }, 1000);

        function checkForm() {
            var name = document.getElementById("name").value;
            var guess = document.getElementById("guess").value;
            var ok = true;

            if (name === "") {
                document.getElementById("msg-name").textContent = "please enter your name!";
                document.getElementById("msg-name").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-name").textContent = "Great name!";
                document.getElementById("msg-name").style.color = "green";
            }

            if (guess === "") {
                document.getElementById("msg-guess").textContent = "Please enter a guess!";
                document.getElementById("msg-guess").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-guess").textContent = "Guess saved!";
                document.getElementById("msg-guess").style.color = "green";
            }

            if (ok) {
                document.getElementById("result").textContent = "Good luck, " + name + "! Your guess of " + guess + " has been submitted.";
                document.getElementById("result").style.color = "blue";
            }
        }
    </script>

</body>

</html>
